services:
  - type: web
    name: ledgerloop
    runtime: python
    plan: free
    region: singapore
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_MODELS
        value: gemini-2.5-flash-lite,gemini-2.5-flash
      - key: LEDGERLOOP_DATA_DIR
        value: data_large
