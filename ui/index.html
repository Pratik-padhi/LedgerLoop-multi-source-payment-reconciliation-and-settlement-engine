<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LedgerLoop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 14.21 3"/><path d="M22 12c0 5.523-4.477 10-10 10"/></svg>
      <span>LedgerLoop</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-panel="overview">
        Overview
      </button>
      <button class="nav-item" data-panel="exceptions">
        Exceptions
        <span class="badge" id="exc-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-panel="qa">
        Q&A
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle btn btn-secondary" id="theme-toggle" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Dark</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" role="main">
    <!-- Overview Panel -->
    <section class="panel active" id="panel-overview" aria-labelledby="overview-title">
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-head"><h1 id="overview-title">Reconciliation Dashboard</h1></div>
        <div class="card-body" id="overview-content">
          <div class="loading">Loading…</div>
        </div>
      </div>
    </section>

    <!-- Exceptions Panel -->
    <section class="panel" id="panel-exceptions" aria-labelledby="exceptions-title">
      <div class="card" style="margin-bottom:1rem">
        <div class="card-head"><h2 id="exceptions-title">Exceptions Requiring Attention</h2></div>
        <div class="card-body" id="exceptions-content">
          <div class="loading">Loading…</div>
        </div>
      </div>
    </section>

    <!-- Q&A Panel -->
    <section class="panel" id="panel-qa" aria-labelledby="qa-title">
      <div class="card">
        <div class="card-head"><h2 id="qa-title">Settlement Q&A</h2></div>
        <div class="card-body" id="qa-content">
          <div class="empty-msg">Select the Q&A tab to load the question interface.</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
