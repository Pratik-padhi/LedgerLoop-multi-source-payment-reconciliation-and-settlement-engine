name: LedgerLoop CI
on: [push, pull_request]
jobs:
  test-offline:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_dataset.py
      - run: python -m pytest -q
